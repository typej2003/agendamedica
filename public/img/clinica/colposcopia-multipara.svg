<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" role="img"
     aria-label="Esquema del cuello uterino, orificio redondo (multípara)">
  <defs>
    <radialGradient id="ecto2" cx="46%" cy="38%" r="64%">
      <stop offset="0%" stop-color="#f7cbb9"/>
      <stop offset="42%" stop-color="#eda08b"/>
      <stop offset="74%" stop-color="#d97668"/>
      <stop offset="92%" stop-color="#bd5850"/>
      <stop offset="100%" stop-color="#a34843"/>
    </radialGradient>
    <radialGradient id="zona2" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#f9d2c1" stop-opacity=".95"/>
      <stop offset="44%" stop-color="#f6c6b1" stop-opacity=".82"/>
      <stop offset="72%" stop-color="#eca38c" stop-opacity=".46"/>
      <stop offset="100%" stop-color="#e58f7c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="os2" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#3d1311"/>
      <stop offset="45%" stop-color="#6a2621"/>
      <stop offset="100%" stop-color="#a94a44"/>
    </radialGradient>
    <radialGradient id="borde2" cx="50%" cy="50%" r="50%">
      <stop offset="86%" stop-color="#8f3d38" stop-opacity="0"/>
      <stop offset="97%" stop-color="#8f3d38" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#8f3d38" stop-opacity="0"/>
    </radialGradient>
    <filter id="halo2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="brillo2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="suave2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#ffffff"/>

  <ellipse cx="260" cy="203" rx="176" ry="150" fill="#e49b8a" opacity=".55" filter="url(#halo2)"/>

  <ellipse cx="260" cy="200" rx="170" ry="144" fill="url(#ecto2)"/>
  <ellipse cx="260" cy="200" rx="170" ry="144" fill="url(#borde2)"/>

  <ellipse cx="260" cy="200" rx="110" ry="96" fill="url(#zona2)"/>
  <ellipse cx="260" cy="200" rx="110" ry="96" fill="none" stroke="#f6c3ad" stroke-opacity=".35" stroke-width="1.5" filter="url(#suave2)"/>

  <!-- Orificio externo redondo, con el labio anterior marcado (multípara). -->
  <ellipse cx="260" cy="200" rx="36" ry="33" fill="#d98a76" opacity=".30"/>
  <ellipse cx="260" cy="200" rx="26" ry="24" fill="url(#os2)"/>
  <ellipse cx="260" cy="213" rx="24" ry="8" fill="#f0b9a6" opacity=".22"/>

  <ellipse cx="202" cy="144" rx="60" ry="33" fill="#ffffff" opacity=".30" filter="url(#brillo2)" transform="rotate(-18 202 144)"/>
  <ellipse cx="316" cy="258" rx="44" ry="23" fill="#ffffff" opacity=".15" filter="url(#brillo2)" transform="rotate(-12 316 258)"/>
</svg>
