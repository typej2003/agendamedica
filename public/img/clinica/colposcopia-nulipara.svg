<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" role="img"
     aria-label="Esquema del cuello uterino, orificio transverso (nulípara)">
  <defs>
    <radialGradient id="ecto" cx="46%" cy="38%" r="64%">
      <stop offset="0%" stop-color="#f8cfbe"/>
      <stop offset="42%" stop-color="#f0a48f"/>
      <stop offset="74%" stop-color="#dd7a6b"/>
      <stop offset="92%" stop-color="#c05a51"/>
      <stop offset="100%" stop-color="#a84943"/>
    </radialGradient>
    <!-- Zona de transformación: el anillo pálido alrededor del orificio, que es donde el médico mira. -->
    <radialGradient id="zona" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#fad6c6" stop-opacity=".95"/>
      <stop offset="46%" stop-color="#f7c9b6" stop-opacity=".80"/>
      <stop offset="72%" stop-color="#eea992" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#e58f7c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="os" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8f3831"/>
      <stop offset="55%" stop-color="#5d201d"/>
      <stop offset="100%" stop-color="#3f1412"/>
    </linearGradient>
    <!-- La sombra del borde del cuello: el pliegue que separa el ectocérvix del fondo. -->
    <radialGradient id="borde" cx="50%" cy="50%" r="50%">
      <stop offset="86%" stop-color="#8f3d38" stop-opacity="0"/>
      <stop offset="97%" stop-color="#8f3d38" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#8f3d38" stop-opacity="0"/>
    </radialGradient>
    <filter id="halo" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="brillo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="suave" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#ffffff"/>

  <!-- Halo difuso del borde, como se ve a través del espéculo. -->
  <ellipse cx="260" cy="203" rx="176" ry="150" fill="#e8a08f" opacity=".55" filter="url(#halo)"/>

  <ellipse cx="260" cy="200" rx="170" ry="144" fill="url(#ecto)"/>
  <ellipse cx="260" cy="200" rx="170" ry="144" fill="url(#borde)"/>

  <!-- Zona de transformación. -->
  <ellipse cx="260" cy="200" rx="104" ry="92" fill="url(#zona)"/>
  <ellipse cx="260" cy="200" rx="104" ry="92" fill="none" stroke="#f6c3ad" stroke-opacity=".35" stroke-width="1.5" filter="url(#suave)"/>

  <!-- Orificio externo transverso (nulípara). -->
  <ellipse cx="260" cy="197" rx="34" ry="16" fill="#d98a76" opacity=".35"/>
  <rect x="234" y="192" width="52" height="17" rx="8.5" fill="url(#os)"/>
  <rect x="234" y="192" width="52" height="6" rx="3" fill="#f6c7b6" opacity=".28"/>

  <!-- Brillos del epitelio. -->
  <ellipse cx="205" cy="146" rx="62" ry="34" fill="#ffffff" opacity=".30" filter="url(#brillo)" transform="rotate(-18 205 146)"/>
  <ellipse cx="312" cy="256" rx="46" ry="24" fill="#ffffff" opacity=".16" filter="url(#brillo)" transform="rotate(-12 312 256)"/>
</svg>
