<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" role="img"
     aria-label="Esquema de la cavidad uterina para histeroscopía">
  <defs>
    <radialGradient id="cavidad" cx="50%" cy="38%" r="66%">
      <stop offset="0%" stop-color="#f9d3c4"/>
      <stop offset="45%" stop-color="#f0a893"/>
      <stop offset="78%" stop-color="#dd7f70"/>
      <stop offset="100%" stop-color="#b85750"/>
    </radialGradient>
    <radialGradient id="fondo" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#f7c9b6" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#e58f7c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ostium" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3d1311"/>
      <stop offset="60%" stop-color="#6a2621"/>
      <stop offset="100%" stop-color="#a94a44"/>
    </radialGradient>
    <linearGradient id="canal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8f3831"/>
      <stop offset="100%" stop-color="#d98a76"/>
    </linearGradient>
    <filter id="halo" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="brillo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="suave" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="520" height="400" fill="#ffffff"/>
  <ellipse cx="260" cy="196" rx="150" ry="140" fill="#e8a08f" opacity=".45" filter="url(#halo)"/>

  <!-- Cavidad: fondo (arriba) y cuerpo que baja al canal cervical. -->
  <path d="M 260 62 C 330 62 372 104 372 152 C 372 200 330 236 300 262 L 300 330
           C 300 344 288 352 276 352 L 244 352 C 232 352 220 344 220 330 L 220 262
           C 190 236 148 200 148 152 C 148 104 190 62 260 62 Z"
        fill="url(#cavidad)" stroke="#a94a44" stroke-opacity=".28" stroke-width="2"/>
  <path d="M 260 74 C 322 74 358 112 358 152 C 358 194 320 226 290 252
           C 280 260 272 272 272 286 L 272 326 C 272 334 266 338 260 338
           C 254 338 248 334 248 326 L 248 286 C 248 272 240 260 230 252
           C 200 226 162 194 162 152 C 162 112 198 74 260 74 Z"
        fill="url(#fondo)" filter="url(#suave)"/>

  <!-- Los dos ostium tubáricos, arriba a los costados. -->
  <ellipse cx="196" cy="128" rx="21" ry="17" fill="url(#ostium)"/>
  <ellipse cx="324" cy="128" rx="21" ry="17" fill="url(#ostium)"/>
  <ellipse cx="196" cy="122" rx="15" ry="6" fill="#f3b9a6" opacity=".22"/>
  <ellipse cx="324" cy="122" rx="15" ry="6" fill="#f3b9a6" opacity=".22"/>

  <!-- Canal cervical, al centro abajo. -->
  <path d="M 244 300 L 276 300 L 272 352 L 248 352 Z" fill="url(#canal)" opacity=".55"/>

  <!-- Brillos del endometrio. -->
  <ellipse cx="222" cy="180" rx="46" ry="52" fill="#ffffff" opacity=".20" filter="url(#brillo)" transform="rotate(-14 222 180)"/>
  <ellipse cx="312" cy="200" rx="30" ry="38" fill="#ffffff" opacity=".12" filter="url(#brillo)" transform="rotate(-10 312 200)"/>
</svg>
